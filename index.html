<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d6b5f" />
    <meta name="description" content="Organizador financeiro pessoal simples e gratuito." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>Meu Financeiro</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">ORGANIZADOR PESSOAL</p>
          <h1>Meu Financeiro</h1>
        </div>
        <button class="icon-button" id="install-button" type="button" hidden aria-label="Instalar aplicativo">⇩</button>
      </header>

      <main>
        <section class="balance-card" aria-labelledby="balance-title">
          <div class="balance-heading">
            <div>
              <p class="card-label" id="balance-title">Saldo atual</p>
              <strong id="balance-value">R$ 0,00</strong>
            </div>
            <span class="balance-icon">R$</span>
          </div>
          <div class="balance-rule"></div>
          <div class="summary-grid">
            <div><span>Entradas</span><strong class="income" id="income-value">R$ 0,00</strong></div>
            <div><span>Saídas</span><strong class="expense" id="expense-value">R$ 0,00</strong></div>
          </div>
        </section>

        <section class="section-heading">
          <div><p class="eyebrow">VISÃO GERAL</p><h2>Movimentações</h2></div>
          <div class="date-filters" aria-label="Filtrar por período"><label>De<input id="date-from" type="date" aria-label="Data inicial" /></label><label>Até<input id="date-to" type="date" aria-label="Data final" /></label><button id="clear-date-filter" type="button">Limpar</button></div>
        </section>

        <section class="transactions" id="transactions" aria-live="polite"></section>
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">✦</div>
          <h3>Nenhuma movimentação ainda</h3>
          <p>Comece registrando uma entrada ou uma saída.</p>
        </div>
      </main>

      <button class="primary-button floating-action" id="open-modal" type="button"><span>＋</span> Adicionar movimentação</button>

      <footer class="bottom-actions">
        <button type="button" id="export-csv">Exportar CSV</button>
        <button type="button" id="export-json">Backup JSON</button>
        <button type="button" id="clear-data" class="danger-link">Apagar dados</button>
      </footer>
    </div>

    <div class="modal-backdrop" id="modal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header"><div><p class="eyebrow">NOVO LANÇAMENTO</p><h2 id="modal-title">Adicionar movimentação</h2></div><button class="close-button" id="close-modal" type="button" aria-label="Fechar">×</button></div>
        <form id="transaction-form">
          <div class="type-toggle" role="group" aria-label="Tipo de movimentação"><button type="button" class="type-option active" data-type="expense">Saída</button><button type="button" class="type-option" data-type="income">Entrada</button></div>
          <input type="hidden" id="type" value="expense" />
          <label>Título<input id="title" name="title" required maxlength="80" placeholder="Ex.: Mercado" /></label>
          <div class="form-row"><label>Valor<input id="amount" name="amount" required inputmode="decimal" type="text" inputmode="numeric" autocomplete="off" placeholder="0,00" /></label><label>Data<input id="date" name="date" required type="date" /></label></div>
          <p class="form-error" id="form-error" role="alert"></p>
          <button class="primary-button" type="submit">Salvar movimentação</button>
        </form>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
